name: Tests

# Fast suite only - pure logic, the small embedding model and a throwaway
# pgvector database (service container below); no gated-model download and no
# production secrets. The slow, real-model suite (tests/test_generation.py)
# is manually triggered - see slow-tests.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI database. The tests only ever use TEST_DATABASE_URL.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[dev]'

      - name: Migrate and load the knowledge base
        run: |
          python scripts/migrate.py
          python scripts/sync_facts.py

      - name: Run fast test suite
        run: pytest -v

      - name: Retrieval evaluation gate
        run: python scripts/score_evaluation.py --min-retrieval-hit-rate 0.5

      - name: Lint and format check
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
